services:
  uptimy-agent:
    image: ghcr.io/uptimy/agent:latest
    # build: .   # uncomment to build from source
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # Optional. Without it, the admin password is printed once in the logs
      # (docker compose logs) and must be changed at first sign-in.
      # ADMIN_PASSWORD: change-me
      MONITORS_FILE: /config/monitors.yaml
    volumes:
      - uptimy-agent-data:/data
      - ./examples/monitors.yaml:/config/monitors.yaml:ro

volumes:
  uptimy-agent-data:
