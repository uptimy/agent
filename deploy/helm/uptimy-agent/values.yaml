image:
  repository: ghcr.io/uptimy/agent
  tag: ""            # defaults to the chart appVersion
  pullPolicy: IfNotPresent

# Password for the default "admin" user. Leave empty and a random one is
# printed once in the pod log (kubectl logs deploy/uptimy-agent) and must be
# changed at first sign-in. Or point at an existing Secret with existingSecret.
adminPassword: ""
existingSecret: ""         # Secret with key ADMIN_PASSWORD

# How this agent is labeled in Uptimy. Defaults to the release name
# (the pod's hostname would change on every restart).
agentName: ""

# Declarative monitors, rendered into a ConfigMap. Same schema as
# examples/monitors.yaml. Leave both empty to manage monitors in the UI only.
healthchecks: []
#  - name: Checkout API
#    type: http
#    target: http://checkout.shop.svc.cluster.local:8080/health
#    interval: 30s
#  - name: Checkout deployment
#    type: kubernetes
#    target: shop/deployment/checkout
#  - name: Postgres
#    type: postgres
#    target: postgres://monitor:${PG_PASSWORD}@postgres.shop.svc:5432/shop
heartbeats: []
#  - name: Nightly backup
#    cron: "0 3 * * *"
#    timezone: Europe/Berlin
#    grace: 30m

# Every check result and heartbeat run is kept retentionDays; one row a
# day per monitor (uptime, response time percentiles) historyDays.
retentionDays: 30
historyDays: 400

# Proxies whose X-Forwarded-For/-Proto headers are believed (sign-in rate
# limits per client, Secure cookies behind TLS-terminating Ingresses):
# "private" (loopback and private networks, where Ingress controllers
# connect from), comma-separated addresses or CIDRs, or "none".
trustedProxies: private

# Create monitors for Services, Ingresses, HTTPRoutes and workloads labeled
# upti.my/monitor: "true" (see the chart README). Nothing is monitored until
# something is labeled.
discovery:
  enabled: true

# Prometheus metrics at /metrics: monitor status, check results, heartbeat
# runs, discovery. Scraping needs an API token (Settings → API tokens in the
# agent; read-only is enough) in a Secret:
#   kubectl -n monitoring create secret generic uptimy-agent-metrics --from-literal=token=upa_...
metrics:
  serviceMonitor:
    enabled: false        # needs the Prometheus Operator (monitoring.coreos.com CRDs)
    interval: 60s
    tokenSecret:
      name: ""            # e.g. uptimy-agent-metrics
      key: token
    labels: {}            # e.g. release: kube-prometheus-stack, to match your Prometheus

# Read-only access to Deployments/StatefulSets/DaemonSets for kubernetes
# checks, plus listing labeled Services/Ingresses/HTTPRoutes for discovery.
rbac:
  create: true
  clusterWide: true        # false: only the release namespace

serviceAccount:
  create: true
  name: ""

persistence:
  enabled: true
  size: 1Gi
  storageClass: ""
  existingClaim: ""

service:
  type: ClusterIP
  port: 80

# Set the host below as the status page's custom domain in the UI (Status page
# → Custom domain) and the Ingress serves only the status page: no sign-in,
# API or /metrics on it. Reach the dashboard with kubectl port-forward.
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: status.example.com
      paths: ["/"]
  tls: []

resources:
  requests:
    cpu: 20m
    memory: 32Mi
  limits:
    memory: 128Mi

nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}
# Extra environment variables, e.g. database passwords for ${VAR} in monitor
# targets:
#  - name: PG_PASSWORD
#    valueFrom:
#      secretKeyRef: { name: postgres-monitor, key: password }
extraEnv: []
