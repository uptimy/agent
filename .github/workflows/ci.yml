name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-24.04
    # Real servers for the database checks' integration tests.
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_PASSWORD: testpw }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 20
      mysql:
        image: mysql:8.4
        env: { MYSQL_ROOT_PASSWORD: testpw }
        ports: ["3306:3306"]
        options: --health-cmd "mysqladmin ping -uroot -ptestpw" --health-interval 5s --health-retries 30
      redis:
        image: redis:7-alpine
        options: --entrypoint redis-server
        ports: ["6379:6379"]
    env:
      AGENT_TEST_POSTGRES_URL: postgres://postgres:testpw@localhost:5432/postgres?sslmode=disable
      AGENT_TEST_MYSQL_URL: mysql://root:testpw@127.0.0.1:3306/mysql
      AGENT_TEST_REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14
      - run: go vet ./...
      - run: go test -race ./...

  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  chart:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - run: helm lint deploy/helm/uptimy-agent --strict
      - run: helm lint deploy/helm/uptimy-agent --strict -f deploy/helm/uptimy-agent/ci/monitors-values.yaml
      # Render with defaults and with every option on, and check the
      # manifests against the oldest Kubernetes the chart supports.
      - run: |
          helm template t deploy/helm/uptimy-agent > default.yaml
          helm template t deploy/helm/uptimy-agent -f deploy/helm/uptimy-agent/ci/monitors-values.yaml > full.yaml
          docker run --rm -v "$PWD:/w" ghcr.io/yannh/kubeconform:v0.8.0 -strict -summary -kubernetes-version 1.25.0 /w/default.yaml /w/full.yaml

  image:
    needs: [go, web]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write # keyless cosign signatures
    steps:
      - uses: actions/checkout@v7
      - uses: sigstore/cosign-installer@v4.1.2
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/uptimy/agent
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=edge,branch=main
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: cosign sign --yes ghcr.io/uptimy/agent@${{ steps.build.outputs.digest }}

  # Tags publish the chart as oci://ghcr.io/uptimy/charts/uptimy-agent, with
  # the same version as the agent. Its Artifact Hub metadata is artifacthub.yml.
  chart-release:
    needs: [chart, image]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - uses: sigstore/cosign-installer@v4.1.2
      - uses: oras-project/setup-oras@v2
      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Package, push and sign
        run: |
          v="${GITHUB_REF_NAME#v}"
          sed -i "s|ghcr.io/uptimy/agent:.*|ghcr.io/uptimy/agent:$v|" deploy/helm/uptimy-agent/Chart.yaml
          helm package deploy/helm/uptimy-agent --version "$v" --app-version "$v"
          helm push "uptimy-agent-$v.tgz" oci://ghcr.io/uptimy/charts
          cosign sign --yes "ghcr.io/uptimy/charts/uptimy-agent@$(oras resolve "ghcr.io/uptimy/charts/uptimy-agent:$v")"

  # Tags also publish downloadable binaries on the GitHub release.
  release:
    needs: [go, web]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the changelog is built from the history
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      # The release notes are the version's CHANGELOG section, not a list of
      # commits (a squash-merged release has only one).
      - name: Release notes
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v h="## [$v]" 'index($0, h) == 1 { f = 1; next } /^## \[/ { f = 0 } f' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md" || { echo "CHANGELOG.md has no section for $v"; exit 1; }
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean --release-notes ${{ runner.temp }}/notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
